name: tests-and-eval-gate

on:
  pull_request:
    paths:
      - "src/**"
      - "datasets/**"
      - "pyproject.toml"
      - "uv.lock"
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Lint
        run: uv run ruff check .
      - name: Unit tests (offline)
        run: uv run pytest

  eval-gate:
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'pull_request'
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Preflight providers
        run: uv run python -m aegis.preflight
      - name: Seed knowledge base
        run: uv run python -m aegis.kb.seed
      - name: Run evals vs committed baseline
        run: |
          uv run python scripts/run_evals.py --gate \
            --threshold 0.02
